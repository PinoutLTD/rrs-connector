name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository; nothing here needs write access.
permissions:
  contents: read

# A new push to a branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked fails when uv.lock no longer matches pyproject.toml, which is
      # what the server installs from: a drift found here is never found there.
      - name: Install dependencies from the lock file
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run ruff check src tests

      # The suite is offline — no node, no gateway — so it is stable in CI.
      - name: Tests
        run: uv run pytest -q

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # gitleaks scans history, not just the tip

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-next:
    name: Python 3.14 (informational)
    runs-on: ubuntu-latest
    # Tells us early when a dependency stops working on the next Python, the
    # way substrate-interface did for the integration. Never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Tests on 3.14
        run: uv run --python 3.14 --extra dev pytest -q
