network: "polkadot"

wss:
  polkadot:
    - "wss://polkadot.rpc.robonomics.network/"
  kusama:
    - "wss://kusama.rpc.robonomics.network/"

# Tried in order. Reports are pinned on Pinata, so its gateway serves fresh CIDs;
# public gateways may stall until they find the content in the IPFS network.
ipfs_gateways:
  - "https://gateway.pinata.cloud/"
  - "https://ipfs.io/"

timeouts:
  datalog_request_seconds: 15
  ipfs_download_seconds: 60

retries:
  datalog_request_max_attempts: 3
  ipfs_download_max_attempts: 3
  retry_backoff_seconds: 2