[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rrs-connector"
version = "0.1.0"
description = "A console utility that collects reports from the Robonomics Report Service integration for Home Assistant"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.13,<4.0"
license = {file = "LICENSE"}
authors = [
    {name = "Ivan Berman", email = "fingerling42@proton.me"},
]

dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    # Report files are NaCl secret boxes; decryptor.py opens them directly.
    "pynacl>=1.6.2",
    "pyyaml>=6.0.3",
    "requests>=2.33",
    "robonomics-interface>=2.0.0",
    "sqlalchemy>=2.0.49",
    "substrate-interface>=1.8.1",
    # retry.py catches its exception to tell a dropped socket from a data error.
    "websocket-client>=1.9.0",
]

[project.scripts]
rrs-connector = "rrs_connector.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
  ".venv",
  "data",
  "cache",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = [
    "--disable-plugin-autoload",
]
testpaths = ["tests"]
